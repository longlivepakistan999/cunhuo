<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>资产存活探测</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    .head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: #94a3b8; font-size: 13px; }

    .btn {
      padding: 8px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .btn.ghost { background: #334155; color: #cbd5e1; }
    .btn.ghost:hover:not(:disabled) { background: #475569; }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
      margin-bottom: 20px;
    }

    .form { display: none; }
    .form.active { display: block; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input[type=text], input[type=file], input[type=number] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    .row { display: flex; gap: 12px; margin-bottom: 14px; }
    .row > div { flex: 1; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; }

    .err {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #7f1d1d;
      color: #fee2e2;
      font-size: 13px;
      display: none;
    }
    .err.active { display: block; }

    .task {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      border-left: 3px solid #475569;
    }
    .task.running { border-left-color: #3b82f6; }
    .task.queued { border-left-color: #f59e0b; }
    .task.finished { border-left-color: #22c55e; }
    .task.error { border-left-color: #ef4444; }
    .task.cancelled, .task.interrupted { border-left-color: #94a3b8; }

    .task-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .task-name {
      font-size: 15px; font-weight: 600; color: #e2e8f0;
      max-width: 100%;
      word-break: break-all;
    }
    .task-meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .task-meta .filename { color: #cbd5e1; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-right: 6px;
    }
    .b-running { background: #1e40af; color: #dbeafe; }
    .b-queued { background: #78350f; color: #fef3c7; }
    .b-finished { background: #166534; color: #dcfce7; }
    .b-error { background: #7f1d1d; color: #fee2e2; }
    .b-cancelled, .b-interrupted { background: #475569; color: #e2e8f0; }

    .task-body { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap;
                 align-items: center; }
    .stat { font-size: 13px; color: #94a3b8; }
    .stat b { color: #e2e8f0; }
    .alive-c { color: #4ade80 !important; }
    .dead-c { color: #f87171 !important; }

    .progress {
      flex: 1; min-width: 180px;
      height: 8px; background: #0f172a;
      border-radius: 4px; overflow: hidden; border: 1px solid #334155;
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22d3ee);
      width: 0%; transition: width .3s;
    }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .actions a, .actions button {
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .a-up { background: #1e40af; color: #dbeafe; }
    .a-up:hover:not(:disabled) { background: #1d4ed8; }
    .a-cancel { background: #78350f; color: #fef3c7; }
    .a-cancel:hover:not(:disabled) { background: #92400e; }
    .a-alive { background: #166534; color: #dcfce7; }
    .a-alive:hover { background: #15803d; }
    .a-dead { background: #7f1d1d; color: #fee2e2; }
    .a-dead:hover { background: #991b1b; }
    .a-del { background: #475569; color: #e2e8f0; }
    .a-del:hover { background: #ef4444; }
    .actions button:disabled { opacity: .5; cursor: not-allowed; }

    .empty {
      background: #1e293b; border-radius: 12px; padding: 40px;
      text-align: center; color: #64748b; font-size: 14px;
    }

    .err-msg {
      margin-top: 8px; padding: 6px 10px;
      background: #7f1d1d; color: #fee2e2;
      border-radius: 4px; font-size: 12px;
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>资产存活探测</h1>
      <div class="sub">同时只跑一个任务,其它排队;支持提前/终止/删除。</div>
    </div>
    <button class="btn" id="new-btn" type="button">+ 新建任务</button>
  </div>

  <div class="card form" id="form-card">
    <form id="f">
      <div class="row">
        <div>
          <label>任务名称</label>
          <input type="text" id="name" name="name" placeholder="例如：某客户外网资产-2024Q1" required>
        </div>
        <div style="max-width: 140px;">
          <label>线程数</label>
          <input type="number" id="threads" name="threads" value="30" min="1" max="200">
        </div>
      </div>
      <div class="row">
        <div>
          <label>域名文件 (.txt,每行一个)</label>
          <input type="file" id="file" name="file" accept=".txt,text/plain" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="cancel-new">取消</button>
        <button type="submit" class="btn" id="submit-btn">加入队列</button>
      </div>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div id="list"></div>
</div>

<script>
const formCard = document.getElementById('form-card');
const form = document.getElementById('f');
const newBtn = document.getElementById('new-btn');
const cancelNew = document.getElementById('cancel-new');
const submitBtn = document.getElementById('submit-btn');
const err = document.getElementById('err');

let pollTimer = null;

function showErr(msg) { err.textContent = msg; err.classList.add('active'); }
function clearErr() { err.classList.remove('active'); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

const STATUS_LABEL = {
  running: '运行中', queued: '排队中', finished: '完成',
  error: '出错', cancelled: '已终止', interrupted: '中断',
};

function renderTask(j) {
  const label = STATUS_LABEL[j.status] || j.status;
  const total = j.total || 0;
  const pct = total ? Math.floor((j.done / total) * 100) : 0;

  let metaBits = [];
  if (j.queue_rank) metaBits.push(`队列 #${j.queue_rank}`);
  metaBits.push(`<span class="filename">${escapeHtml(j.filename || '-')}</span>`);
  metaBits.push(`总数 ${total}`);
  metaBits.push(`线程 ${j.threads}`);
  metaBits.push(`提交 ${fmtTime(j.created_at)}`);

  let body = '';
  if (j.status === 'running') {
    body = `
      <div class="task-body">
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="stat"><b>${pct}%</b> (${j.done}/${total})</div>
        <div class="stat">存活 <b class="alive-c">${j.alive}</b></div>
        <div class="stat">失败 <b class="dead-c">${j.dead}</b></div>
        ${j.cancelling ? '<div class="stat" style="color:#f59e0b;">终止中...</div>' : ''}
      </div>`;
  } else if (j.status === 'queued') {
    body = `<div class="task-body">
        <div class="stat">等待运行...</div>
      </div>`;
  } else {
    body = `
      <div class="task-body">
        <div class="stat">存活 <b class="alive-c">${j.alive}</b></div>
        <div class="stat">失败 <b class="dead-c">${j.dead}</b></div>
        <div class="stat">完成 <b>${fmtTime(j.finished_at)}</b></div>
      </div>`;
  }

  let actions = '<div class="actions">';
  if (j.status === 'queued') {
    actions += `<button class="a-up" data-act="up" data-id="${j.id}"
                  ${j.queue_rank === 1 ? 'disabled' : ''}>↑ 提前</button>`;
    actions += `<button class="a-cancel" data-act="cancel" data-id="${j.id}">终止</button>`;
    actions += `<button class="a-del" data-act="del" data-id="${j.id}">删除</button>`;
  } else if (j.status === 'running') {
    actions += `<button class="a-cancel" data-act="cancel" data-id="${j.id}"
                  ${j.cancelling ? 'disabled' : ''}>终止</button>`;
  } else {
    actions += `<a class="a-alive" href="/download/${j.id}/alive" download>下载 alive</a>`;
    actions += `<a class="a-dead" href="/download/${j.id}/dead" download>下载 dead</a>`;
    actions += `<button class="a-del" data-act="del" data-id="${j.id}">删除</button>`;
  }
  actions += '</div>';

  const errBlock = j.error
    ? `<div class="err-msg">错误: ${escapeHtml(j.error)}</div>` : '';

  return `<div class="task ${j.status}">
    <div class="task-top">
      <div>
        <div class="task-name">
          <span class="badge b-${j.status}">${label}</span>
          ${escapeHtml(j.name || '(未命名)')}
        </div>
        <div class="task-meta">${metaBits.join(' · ')}</div>
      </div>
    </div>
    ${body}
    ${errBlock}
    ${actions}
  </div>`;
}

let pollFailures = 0;

async function loadList() {
  try {
    const r = await fetch('/jobs');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    pollFailures = 0;
    const box = document.getElementById('list');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">暂无任务,点击右上角"新建任务"开始</div>';
    } else {
      box.innerHTML = rows.map(renderTask).join('');
      box.querySelectorAll('button[data-act]').forEach(b => {
        b.addEventListener('click', () => doAction(b.dataset.act, b.dataset.id));
      });
    }
    const active = rows.some(j => j.status === 'running' || j.status === 'queued');
    schedulePoll(active ? 800 : null);
  } catch (e) {
    // Don't blow away the existing list on transient failures - just retry
    // with backoff. Without this any single network hiccup permanently
    // freezes the progress bar.
    pollFailures++;
    const delay = Math.min(30000, 1000 * Math.pow(2, pollFailures));
    console.warn('loadList failed, retrying in', delay, 'ms:', e.message);
    schedulePoll(delay);
  }
}

function schedulePoll(ms) {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  if (ms) pollTimer = setTimeout(loadList, ms);
}

async function doAction(act, id) {
  if (act === 'del' && !confirm('确认删除该任务及其结果文件?')) return;
  if (act === 'cancel' && !confirm('确认终止该任务?')) return;

  let url, method;
  if (act === 'up')     { url = `/jobs/${id}/move_up`; method = 'POST'; }
  if (act === 'cancel') { url = `/jobs/${id}/cancel`;  method = 'POST'; }
  if (act === 'del')    { url = `/jobs/${id}`;         method = 'DELETE'; }

  try {
    const r = await fetch(url, { method });
    const data = await r.json();
    if (!r.ok) { alert(data.error || '操作失败'); return; }
    loadList();
  } catch (e) {
    alert('网络错误: ' + e.message);
  }
}

newBtn.addEventListener('click', () => {
  formCard.classList.add('active');
  document.getElementById('name').focus();
});
cancelNew.addEventListener('click', () => {
  formCard.classList.remove('active');
  form.reset();
  clearErr();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErr();
  const fd = new FormData(form);
  submitBtn.disabled = true;
  submitBtn.textContent = '上传中...';
  try {
    const r = await fetch('/upload', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) {
      showErr(data.error || '上传失败');
    } else {
      form.reset();
      formCard.classList.remove('active');
      loadList();
    }
  } catch (e) {
    showErr('网络错误: ' + e.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '加入队列';
  }
});

loadList();
</script>
</body>
</html>
